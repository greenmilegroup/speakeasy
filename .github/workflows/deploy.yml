name: Deploy

# Cloudflare's own Git build is configured in its dashboard, which is where
# this project's deploys quietly stopped doing anything: with no build command
# set, it published the repository as-is, so /fr/ and every pre-rendered page
# simply were not there. This runs the build here, where the configuration is
# in the repository and a failure is visible on the commit, and uploads the
# result with Wrangler.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the sitemap's lastmod is read from git

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Build the site
        run: bash tools/build-site.sh

      # The same assertions the Build workflow makes. A deploy that ships a
      # site with no French pages is the failure this whole workflow exists to
      # prevent, so it is checked here too rather than assumed.
      - name: Check the build produced a whole site
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -f dist/index.html ] || fail "dist/index.html is missing"
          fr=$(ls dist/fr/*.html 2>/dev/null | wc -l)
          en=$(ls dist/*.html | wc -l)
          [ "$fr" -gt 0 ] || fail "no French pages under dist/fr/"
          [ "$en" -eq "$fr" ] || fail "$en English pages but $fr French"
          if grep -qE '(src|href|poster)="(assets|css|js)/' dist/fr/*.html; then
            fail "French pages carry relative asset paths"
          fi
          echo "$en English, $fr French"

      # functions/ is read from the repository root, so the contact form is
      # deployed with the site rather than left behind.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=speakeasy --branch=main

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo
            [ -f dist/version.txt ] && sed 's/^/    /' dist/version.txt
          } >> "$GITHUB_STEP_SUMMARY"
